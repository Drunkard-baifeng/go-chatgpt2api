# 复制为 config.yaml；填写密钥和 PostgreSQL 凭据后才能启动。
# 启动时只读取此文件；PG* 连接环境变量会被拒绝，避免隐式覆盖。
server:
  host: "127.0.0.1"
  port: 8100
  trusted_proxies: []
  # 同源或 Vite 代理无需填写；独立 API 地址请填写前端来源，不带路径或尾斜杠。
  allowed_origins: []

auth:
  admin_key: ""

database:
  type: postgresql
  host: "127.0.0.1"
  port: 5432
  name: "chatgpt2api_go"
  username: "chatgpt2api"
  password: ""
  sslmode: prefer
  connect_timeout_seconds: 10
  operation_timeout_seconds: 30
  max_open_connections: 30
  max_idle_connections: 10
  connection_max_lifetime_seconds: 3600

upstream:
  # 留空使用账号池轮转；填写管理 ID 时固定账号，仍检查其可用性。
  account_id: ""
  profile: "chrome_146"
  text_timeout_seconds: 300
  total_timeout_seconds: 170
  header_timeout_seconds: 30
  read_idle_timeout_seconds: 30
  max_response_bytes: 16777216
  # 图片整批总预算 = SSE 窗口 + 轮询窗口 + 30 秒，不受 total_timeout_seconds 覆盖。
  image_stream_seconds: 80
  image_poll_seconds: 60

images:
  # 相对路径以此配置文件所在目录为基准，仅 Go 使用。
  directory: "data/images"
  # 优先使用此地址；留空依次取系统设置 base_url、当前请求地址，无来源时返回相对地址。
  # HTTPS 反向代理部署时显式填写公开地址，不依赖外部转发头。
  public_base_url: ""

# 独立于图片目录，不能相同或互相嵌套。
image_tasks:
  directory: "data/image_tasks"
  workers: 4
  queue: 32

# PPT、PSD 与 ZIP 产物使用独立目录，不得与上述两个目录重叠。
editable_files:
  directory: "data/files"
  workers: 2
  queue: 16
