# Linux / 1Panel：仅部署应用，PostgreSQL 由用户独立部署。
services:
  api:
    image: ghcr.io/drunkard-baifeng/go-chatgpt2api:latest
    env_file:
      - .env
    network_mode: host
    volumes:
      - go_image_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${SERVER_PORT:-8100}/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  go_image_data:
